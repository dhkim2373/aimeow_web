<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- 강렬한 시그니처 핫 퍼플-레드 그라데이션 -->
    <linearGradient id="clawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="60%" stop-color="#ff3300" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
  </defs>

  <!-- 🐾 고양이 발톱 특유의 '상단 묵직, 하단 날카로운 찢김' 선형 곡선 3줄 -->
  <g fill="url(#clawGradient)">
    <!-- 첫 번째 발톱 자국 (좌측) -->
    <path d="M 16,6 C 22,12 20,28 8,50 C 14,36 18,22 10,12 Z" />

    <!-- 두 번째 발톱 자국 (중앙 - 메인으로 길고 굵게 찢어짐) -->
    <path d="M 34,2 C 42,12 38,36 20,62 C 28,44 34,26 24,8 Z" />

    <!-- 세 번째 발톱 자국 (우측 - 약간 비스듬하게 마무리) -->
    <path d="M 54,10 C 60,18 56,34 40,54 C 48,40 52,28 44,16 Z" />
  </g>
</svg>
