services:
  app:
    # 🎯 지정하신 이미지 이름 및 태그 반영
    image: redbombz/aimeow-rag-center:1.0.0
    
    # 현재 디렉토리의 Dockerfile을 기반으로 빌드
    build:
      context: .
      dockerfile: Dockerfile
      
    container_name: aimeow-rag-container
    
    ports:
      - "8050:8050"
      
    volumes:
      # 1. .env 파일 영구 보존 및 실시간 동기화
      - ./.env:/app/.env
      
      # 2. 서버 설정 JSON 파일 영구 보존
      - ./server_config.json:/app/server_config.json
      
    restart: always